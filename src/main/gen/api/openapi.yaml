        balanceType: ACCRUED_INT_DAILY
        balanceDate: 2000-01-23
        agreementId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        netBalance: 9.301444243932576
        debitAmount: 7.061401241503109
        creditAmount: 2.3021358869347655
        balanceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        balanceId:
          format: uuid
          type: string
        agreementId:
          format: uuid
          type: string
        balanceType:
          enum:
          - ACCRUED_INT_DAILY
          - ACCRUED_INT_CUMULATED
          type: string
        creditAmount:
          type: number
        debitAmount:
          type: number
        netBalance:
          type: number
        balanceDate:
          format: date
          type: string
      type: object
    InterestRateDTO:
      example:
        interestRate: 6.027456183070403
        interestRateId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        baseRate: 1.4658129805029452
        spreadRate: 5.962133916683182
        effectiveRate: 5.637376656633329
        agreementId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        interestRateType: FIXED
        effectiveDate: 2000-01-23
      properties:
        interestRateId:
          format: uuid
          type: string
        agreementId:
          format: uuid
          type: string
        interestRateType:
          enum:
          - FIXED
          - VARIABLE
          type: string
        interestRate:
          type: number
        baseRate:
          type: number
        spreadRate:
          type: number
        effectiveDate:
          format: date
          type: string
        effectiveRate:
          type: number
      type: object
    PartyDTO:
      example:
        agreementId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        partyId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        unbankId: unbankId
        memberIdNo: memberIdNo
      properties:
        partyId:
          format: uuid
          type: string
        agreementId:
          format: uuid
          type: string
        unbankId:
          type: string
        memberIdNo:
          type: string
      type: object

